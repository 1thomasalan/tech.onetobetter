<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Offline · The Tech Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#ffffff" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 24px;
         font: 17px/1.55 Helvetica, "Nimbus Sans", Arial, sans-serif; color: #171717; background: #fff; }
  main { max-width: 30rem; width: 100%; }
  img { width: 48px; height: 48px; display: block; margin-bottom: 28px; }
  .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6b6b6b; }
  h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 0 24px; color: #3d3d3d; }
  a.btn { display: inline-block; padding: 12px 20px; border-radius: 999px; background: #C81018; color: #fff;
          text-decoration: none; font-weight: 700; font-size: 15px; }
  a.btn:focus-visible { outline: 3px solid #171717; outline-offset: 3px; }
  .rule { height: 2px; width: 40px; background: #C81018; margin: 0 0 20px; }
  footer { margin-top: 40px; font-size: 13px; color: #8a8a8a; }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f2f2; background: #0f0f0f; }
    p { color: #c9c9c9; } .eyebrow, footer { color: #9a9a9a; }
    a.btn { background: #ef2b35; } .rule { background: #ef2b35; }
    a.btn:focus-visible { outline-color: #f2f2f2; }
  }
</style>
</head>
<body>
<main>
  <img src="/otb-logo-160.png" alt="One to Better" />
  <p class="eyebrow">The Tech Brief</p>
  <div class="rule"></div>
  <h1>This page isn't available offline.</h1>
  <p>You're offline, and this page wasn't saved on this device. Today's brief is, so you can still read it now. Open this page again once you're back online.</p>
  <a class="btn" href="/">Read today's brief</a>
  <footer>A One to Better project</footer>
</main>
</body>
</html>
